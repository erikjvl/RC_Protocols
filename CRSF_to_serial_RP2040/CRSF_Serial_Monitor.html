<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRSF Serial Monitor</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    font-size: 13px;
}

button {
    padding: 5px 10px;
    margin: 3px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
}

button:disabled {
    background-color: #cccccc;
}

.status {
    margin: 8px 0;
    padding: 6px;
    border-radius: 4px;
    font-size: 12px;
}

.connected {
    background-color: #dff0d8;
    color: #3c763d;
}

.disconnected {
    background-color: #f2dede;
    color: #a94442;
}

/* --- COMPACTE HORIZONTALE BALKEN --- */
.channel-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 10px;
}

.channel {
    display: flex;
    align-items: center;
    gap: 6px;
}

.channel-label {
    width: 55px;
    font-weight: bold;
    font-size: 12px;
}

.channel-bar {
    height: 16px;
    width: 260px;
    background-color: #e0e0e0;
    border: 1px solid #999;
    border-radius: 4px;
    position: relative;
}

.channel-fill {
    height: 100%;
    width: 0%;
    background-color: #4CAF50;
    border-radius: 4px;
    transition: width 0.1s;
}

.channel-value {
    width: 50px;
    text-align: right;
    font-size: 12px;
}

.warning {
    background-color: #fff3cd;
    color: #856404;
    padding: 8px;
    border-radius: 4px;
    margin: 10px 0;
    border: 1px solid #ffeeba;
    font-size: 12px;
}
</style>
</head>

<body>
<h2>CRSF Serial Monitor</h2>

<button id="connectBtn">Connect</button>
<button id="disconnectBtn" disabled>Disconnect</button>

<div id="status" class="status disconnected">Disconnected</div>

<h3 style="margin-bottom:4px;">Channels 1–16</h3>
<div id="channels" class="channel-container"></div>

<div class="sbus-info" style="margin-top:10px;">
    Frames: <span id="frameCount">0</span>
</div>

<!-- Waarschuwing onderaan -->
<div class="warning">
    CRSF requires a non‑inverted serial signal at 420000 baud.  
    Ensure your receiver TX pin is connected directly (no inverter).
</div>

<script>
let port = null;
let reader = null;
let keepReading = false;
let frameCount = 0;

const connectBtn = document.getElementById("connectBtn");
const disconnectBtn = document.getElementById("disconnectBtn");
const statusDiv = document.getElementById("status");
const channelsContainer = document.getElementById("channels");
const frameCountSpan = document.getElementById("frameCount");

/* ---- 16 KANALEN ---- */
const channelConfig = [];
for (let i = 1; i <= 16; i++) {
    channelConfig.push({
        number: i,
        name: `CH${i}`
    });
}

channelConfig.forEach(ch => {
    const div = document.createElement("div");
    div.className = "channel";

    div.innerHTML = `
        <div class="channel-label">${ch.name}</div>
        <div class="channel-bar">
            <div class="channel-fill" id="channel${ch.number}"></div>
        </div>
        <div class="channel-value" id="channelValue${ch.number}">0</div>
    `;

    channelsContainer.appendChild(div);
});

/* ---------------- RESET STATE ---------------- */
function resetState() {
    frameCount = 0;
    frameCountSpan.textContent = "0";

    for (let i = 1; i <= 16; i++) {
        document.getElementById(`channel${i}`).style.width = "0%";
        document.getElementById(`channelValue${i}`).textContent = "0";
    }
}

/* ---------------- CONNECT ---------------- */
connectBtn.addEventListener("click", connectToSerial);

async function connectToSerial() {
    keepReading = false;

    if (reader) {
        try { await reader.cancel(); } catch(e) {}
        reader = null;
    }

    if (port) {
        try { await port.close(); } catch(e) {}
        port = null;
    }

    resetState();
    keepReading = true;

    try {
        port = await navigator.serial.requestPort();
        await port.open({
            baudRate: 420000,   // CRSF standaard
            dataBits: 8,
            stopBits: 1,
            parity: "none"
        });

        statusDiv.textContent = "Connected";
        statusDiv.className = "status connected";
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;

        readFromSerial();
    } catch (err) {
        statusDiv.textContent = "Error: " + err.message;
    }
}

/* ---------------- DISCONNECT ---------------- */
disconnectBtn.addEventListener("click", disconnectFromSerial);

async function disconnectFromSerial() {
    keepReading = false;

    try {
        if (reader) {
            await reader.cancel();
            reader.releaseLock();
        }
    } catch(e) {}

    try {
        if (port) await port.close();
    } catch(e) {}

    reader = null;
    port = null;

    resetState();

    statusDiv.textContent = "Disconnected";
    statusDiv.className = "status disconnected";
    connectBtn.disabled = false;
    disconnectBtn.disabled = true;
}

/* ---------------- SERIAL READER ---------------- */
async function readFromSerial() {
    while (port && port.readable && keepReading) {
        try {
            reader = port.readable.getReader();
            const { value, done } = await reader.read();
            if (done) break;

            if (value) parseCRSF(value);

        } finally {
            if (reader) reader.releaseLock();
        }
    }
}

/* ---------------- CRSF PARSER ---------------- */
/*
CRSF frame format:
[0] Address (0xC8 = receiver)
[1] Length (including type + payload + CRC)
[2] Type (0x16 = RC channels)
[3..n] Payload
[last] CRC
*/

let crsfBuffer = [];
let expectedLength = 0;

function parseCRSF(bytes) {
    for (let b of bytes) {
        crsfBuffer.push(b);

        // Minimum header size
        if (crsfBuffer.length === 2) {
            expectedLength = crsfBuffer[1] + 2; // length includes type+payload+crc
        }

        if (expectedLength > 0 && crsfBuffer.length === expectedLength) {
            processCRSFFrame(crsfBuffer);
            crsfBuffer = [];
            expectedLength = 0;
        }
    }
}

function processCRSFFrame(frame) {
    const type = frame[2];

    // Only RC channels frame
    if (type !== 0x16) return;

    frameCount++;
    frameCountSpan.textContent = frameCount;

    // Payload starts at index 3
    const payload = frame.slice(3, frame.length - 1);

    // CRSF RC channels are 11-bit packed, 16 channels = 22 bytes
    const channels = [];

    let bitIndex = 0;
    let currentValue = 0;

    for (let i = 0; i < 16; i++) {
        let value = 0;
        for (let bit = 0; bit < 11; bit++) {
            const byteIndex = Math.floor(bitIndex / 8);
            const bitOffset = bitIndex % 8;

            const bitValue = (payload[byteIndex] >> bitOffset) & 1;
            value |= bitValue << bit;

            bitIndex++;
        }
        channels.push(value);
    }

    updateUI(channels);
}

function updateUI(ch) {
    for (let i = 1; i <= 16; i++) {
        const val = ch[i - 1];

        const fill = document.getElementById(`channel${i}`);
        const txt = document.getElementById(`channelValue${i}`);

        const pct = ((val - 172) / (1811 - 172)) * 100;
        fill.style.width = pct + "%";
        txt.textContent = val;
    }
}
</script>
</body>
</html>
